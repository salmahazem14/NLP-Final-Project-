name: CI/CD Pipeline

on:
  push:
    branches: [mlops-updates]

env:
  IMAGE_NAME: salmahazem1473/mental-health-chatbot

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff
        run: ruff check . --fix --exit-zero

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COLLECTION_NAME: mental_health_counseling
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch first
        run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Download models from Hugging Face
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='salmahazem1473/emotion_classifier', local_dir='models/emotion_classifier')
          snapshot_download(repo_id='salmahazem1473/language_classifier', local_dir='models/language_classifier')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_MODEL_TOKEN }}

      - name: Run tests
        run: python -m pytest tests/tests.py -v

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v4
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-22.04
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/mlops-updates'
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
  
      - name: Install huggingface_hub
        run: pip install huggingface_hub==0.23.4
  
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_MODEL_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          python - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.upload_folder(
              folder_path=".",
              repo_id=space,
              repo_type="space",
              ignore_patterns=[
                  ".git*",
                  ".env",
                  "__pycache__",
                  "*.pyc",
                  "tests/",
                  ".github/",
                  "models/",
                  "data/",
              ],
          )
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          PYEOF
